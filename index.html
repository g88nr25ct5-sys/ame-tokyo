<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10171e"><title>AME — Tokyo</title><meta name="description" content="A quiet night in Tokyo."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2310171e'/%3E%3Cpath d='M17 5L11 19Q8 28 18 27Q26 25 22 18Z' fill='%239caebb'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>

<div id="entry"><div class="entry-copy"><p class="eyebrow">雨 &nbsp; / &nbsp; AME</p><h1>TOKYO</h1><p class="time">2:17 AM</p><button id="enter" disabled>Loading Tokyo</button><p class="entry-note">A quiet night. Stay a while.</p><p id="error" hidden>图片加载失败，请刷新重试。</p></div></div>
<header class="ui"><span>AME <i>—</i> TOKYO</span><span>2:17 AM</span></header>
<div id="caption" class="ui"><span>TOKYO</span><small>2:17 AM</small></div>
<footer class="ui"><span class="hint">轻触画面调节氛围 · 拖动探索</span><nav aria-label="场景控制"><button id="view" title="切换到窗边视角" aria-label="切换到窗边视角">视角：城市</button><button id="reset" title="重置视角">重置</button><button id="sound" aria-label="关闭环境音" aria-pressed="true">环境 ON</button><button id="settings" aria-expanded="false" aria-controls="panel">设置</button><button id="fullscreen">全屏</button></nav></footer>

</div><div class="panel-bottom"><span>2:17 AM &nbsp; / &nbsp; 雨は、まだ降っている。</span><span>轻触画面，回到雨夜</span></div></section>
